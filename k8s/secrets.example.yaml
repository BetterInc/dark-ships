# TEMPLATE ONLY - do not commit real values. Create the real Secret once with
# kubectl (see DEPLOY.md); it lives only in the cluster, never in git or TF.
#
#   kubectl -n dark-ships create secret generic ds-secrets \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://USER:PASS@HOST:5432/darkships?sslmode=require' \
#     --from-literal=AUTH_SECRET='<long-random>' \
#     --from-literal=AISSTREAM_API_KEY_REGIONS='<key>' \
#     --from-literal=GFW_API_TOKEN='<token>' \
#     --from-literal=S3_ACCESS_KEY_ID='<wasabi-key>' \
#     --from-literal=S3_SECRET_ACCESS_KEY='<wasabi-secret>' \
#     --from-literal=AIS_REGIONS='[{"name":"...","bbox":[[.. ]]}]' \
#     --from-literal=GOOGLE_OAUTH_CLIENT_ID='' \
#     --from-literal=GOOGLE_OAUTH_CLIENT_SECRET=''
apiVersion: v1
kind: Secret
metadata:
  name: ds-secrets
  namespace: dark-ships
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://USER:PASS@HOST:5432/darkships?sslmode=require"
  AUTH_SECRET: "change-me-long-random"
  AISSTREAM_API_KEY_REGIONS: ""
  GFW_API_TOKEN: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  AIS_REGIONS: "[]"
  GOOGLE_OAUTH_CLIENT_ID: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
