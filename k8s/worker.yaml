# Ingester + scheduler tier: RUN_MODE=worker. This owns the single AIS
# WebSocket connection, all scheduled jobs, and DB schema/partition setup, so it
# MUST be exactly one instance. replicas: 1 + strategy Recreate guarantees the
# old pod is fully terminated before the new one starts on a rollout - two
# running at once would double every ingested position and every scheduled scan.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dark-ships
  labels: { app: dark-ships, tier: worker }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: dark-ships, tier: worker }
  template:
    metadata:
      labels: { app: dark-ships, tier: worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/brammittendorff/dark-ships:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000   # serves /api/health; not routed by the ingress
          env:
            - name: RUN_MODE
              value: "worker"       # ingester + scheduler + migrations, single replica
          envFrom:
            - configMapRef: { name: ds-config }
            - secretRef: { name: ds-secrets }
          resources:
            requests: { cpu: "150m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
