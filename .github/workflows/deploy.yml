name: deploy

# Build the backend image, push to ghcr, then roll the k8s Deployments on the
# shared Scaleway Kapsule cluster. The frontend builds and deploys to Cloudflare
# Workers (static assets) in its own job. Serialized so rapid pushes don't race
# the rollout.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-dark-ships
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/betterinc/dark-ships

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Frontend deploys via Cloudflare Workers Builds (Git integration on the
  # dark-ships Worker): root directory /frontend, build variable
  # VITE_API_BASE_URL=https://api.darkships.org, `npx wrangler deploy`.
  # Kept out of Actions so there's exactly one deploy path for it.

  deploy:
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment: production          # gates KUBECONFIG to this job
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Guard - KUBECONFIG present?
        id: guard
        env:
          KC: ${{ secrets.KUBECONFIG }}
        run: |
          if [[ -z "$KC" ]]; then
            echo "::warning::KUBECONFIG not set on the production env - skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install kubectl
        if: steps.guard.outputs.skip != 'true'
        uses: azure/setup-kubectl@v4
        with: { version: v1.31.0 }
      - name: Write kubeconfig
        if: steps.guard.outputs.skip != 'true'
        env:
          KC: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          if echo "$KC" | base64 -d 2>/dev/null | grep -q "apiVersion"; then
            echo "$KC" | base64 -d > ~/.kube/config
          else
            printf '%s' "$KC" > ~/.kube/config
          fi
          chmod 600 ~/.kube/config
      # The cluster pulls from ghcr ANONYMOUSLY - this namespace has no
      # imagePullSecret. A freshly published ghcr package is PRIVATE by default,
      # so rolling onto one that has not been made public is an instant
      # ImagePullBackOff on a live Deployment. Fail before touching anything.
      - name: Verify the new image is anonymously pullable
        if: steps.guard.outputs.skip != 'true'
        env:
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          set -euo pipefail
          REPO="${IMAGE#ghcr.io/}"
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${REPO}:pull&service=ghcr.io" \
                  | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${REPO}/manifests/${SHA}")
          echo "anonymous pull of ${REPO}:${SHA} -> HTTP ${CODE}"
          if [[ "$CODE" != "200" ]]; then
            echo "::error::ghcr.io/${REPO}:${SHA} is not anonymously pullable (HTTP ${CODE}). The cluster has no imagePullSecret, so rolling would ImagePullBackOff. Make the package public at https://github.com/orgs/BetterInc/packages then re-run this job - production is untouched."
            exit 1
          fi

      # The k8s Deployments/Service/Ingress/ConfigMap are owned by the infra
      # repo (projects-infrastructure modules/dark-ships). CI only rolls the image.
      - name: Roll worker first (it runs migrations), then web
        if: steps.guard.outputs.skip != 'true'
        env:
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          IMG="${IMAGE}:${SHA}"
          # worker owns schema/partitions; Recreate + replicas:1 keeps it single
          kubectl -n dark-ships set image deployment/worker worker="$IMG"
          kubectl -n dark-ships rollout status deployment/worker --timeout=300s
          kubectl -n dark-ships set image deployment/web web="$IMG"
          kubectl -n dark-ships rollout status deployment/web --timeout=300s
      - name: Smoke-test https://api.darkships.org/api/health
        if: steps.guard.outputs.skip != 'true'
        env:
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          for i in $(seq 1 12); do
            OUT=$(curl -s https://api.darkships.org/api/health || true)
            echo "[$i/12] $OUT"
            if [[ "$(echo "$OUT" | jq -r '.version' 2>/dev/null)" == "$SHA" ]]; then
              echo "OK - serving $SHA"; exit 0
            fi
            sleep 5
          done
          echo "::error::api.darkships.org did not report $SHA within 60s"; exit 1
